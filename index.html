<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test upload to GitHub</title>
  <meta name="description" content="Simple test page demonstrating English and Thai text." />
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" role="main" aria-labelledby="page-title">
    <h1 id="page-title">Test Jason File</h1>
   <h2 id="school"></h2>
    <p>Students: <span id="students"></span></p>
    <p>Teachers: <span id="teachers"></span></p>
    <p>Location: <span id="location"></span></p>
    <script>
        fetch("data1.json")
            .then(response => response.json())
            .then(data1 => {
                document.getElementById("school").textContent = data1.school;
                document.getElementById("students").textContent = data1.students;
                document.getElementById("teachers").textContent = data1.teachers;
                document.getElementById("location").textContent = data1.location;
            })
            .catch(error => {
                console.error("Error loading JSON:", error);
            });
    </script>
    
    <img src="https://lh3.googleusercontent.com/d/0B1Vdhzx7qeUVNnFJaWNEZVVteWM" alt="" width="104" height="142">
    <iframe src="https://drive.google.com/file/d/1FCC_rJSPAVDvhd0epPjQrHctivmxds7S/preview" 
        width="640" 
        height="360" 
        allow="autoplay" 
        allowfullscreen>
      </iframe>
    <p><a href="https://script.google.com/macros/s/AKfycbwV4IVOKbWuVySTyGbKsSoVSIvUlU7_qK8cvGNfq9KUdqL3PHH9XuDbq7ZgwzVG7vCvcg/exec">UpLoad PDF and Word Here!</a>
    <a href="https://script.google.com/macros/s/AKfycbzTzny0g5aL6OKIXWHRhA01u-iifSeNp3YGyFzK47YuZ71Wfs_fwFb9IwRzcenorLW5LA/exec">UpLoad Image</a>
    </p>
    <footer>
      <small>Made by atithai</small>
    </footer>
  </main>
</body>
</html>
