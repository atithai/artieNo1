<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test upload to GitHub</title>
  <meta name="description" content="Simple test page demonstrating English and Thai text." />
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" role="main" aria-labelledby="page-title">
    <h1 id="page-title">Hello world</h1>
    <h2 lang="th">สวัสดีครับ</h2>
    <script>
        fetch("data1.json")
            .then(response => response.json())
            .then(data1 => {
                document.getElementById("school").textContent = data1.school;
                document.getElementById("students").textContent = data1.students;
                document.getElementById("teachers").textContent = data1.teachers;
                document.getElementById("location").textContent = data1.location;
            })
            .catch(error => {
                console.error("Error loading JSON:", error);
            });
    </script>
    
    <img src="https://lh3.googleusercontent.com/d/0B1Vdhzx7qeUVNnFJaWNEZVVteWM" alt="" width="104" height="142">
    <iframe src="https://drive.google.com/file/d/1FCC_rJSPAVDvhd0epPjQrHctivmxds7S/preview" 
        width="640" 
        height="360" 
        allow="autoplay" 
        allowfullscreen>
      </iframe>
    <p>This is a small test page. Replace this text with your real content when you're ready.</p>
    <footer>
      <small>Made by atithai</small>
    </footer>
  </main>
</body>
</html>
